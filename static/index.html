<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pile · 我的书架</title>
<link rel="stylesheet" href="/vendor/highlight.css">
<link rel="stylesheet" href="/style.css">
</head>
<body class="view-shelf">

<!-- ============ 书架首页 ============ -->
<section class="shelf-view" id="shelf-view">
  <header class="shelf-top">
    <div class="shelf-brand">
      <h1>我的书架</h1>
      <span class="shelf-count" id="shelf-count"></span>
    </div>
    <div class="shelf-actions">
      <button class="icon-btn" id="btn-theme-shelf" title="切换主题">◐</button>
      <button class="icon-btn" id="btn-settings-shelf" title="连接仓库">⚙</button>
    </div>
  </header>

  <div class="shelf-grid" id="shelf-grid"></div>

  <p class="shelf-tip">
    书架上的书来自 <code>books.json</code>，一门课、一个专题就是一本。
    点开一本书进入阅读，右上角「同步」把本地和仓库对齐。
  </p>
</section>

<!-- ============ 阅读界面 ============ -->
<section class="reader-view" id="reader-view" hidden>

<header class="topbar">
  <button class="icon-btn" id="btn-back" title="返回书架 (Esc)">←</button>
  <button class="icon-btn" id="btn-menu" title="目录">☰</button>
  <div class="brand">
    <span class="brand-name" id="reader-title">笔记</span>
    <span class="repo-chip" id="repo-chip" title="仓库路径">未连接</span>
  </div>
  <div class="sync-zone">
    <span class="sync-status" id="sync-status">—</span>
    <button class="btn-primary" id="btn-sync">同步</button>
  </div>
  <button class="icon-btn" id="btn-search" title="搜索 (/)">🔍</button>
  <button class="icon-btn" id="btn-theme" title="切换主题">◐</button>
</header>

<div class="layout">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <input id="tree-filter" placeholder="过滤文件…" autocomplete="off">
    </div>
    <nav class="tree" id="tree"><div class="empty-hint">加载中…</div></nav>
    <div class="sidebar-foot">
      <button class="link-btn" id="btn-settings">连接其他仓库</button>
    </div>
  </aside>

  <main class="content" id="content">
    <article class="article" id="article">
      <div class="welcome">
        <h1>正在加载…</h1>
      </div>
    </article>
  </main>

  <aside class="toc-pane" id="toc-pane">
    <div class="toc-title">本页目录</div>
    <nav id="toc" class="toc"></nav>
  </aside>

</div>

</section>

<!-- 搜索浮层 -->
<div class="overlay" id="search-overlay" hidden>
  <div class="search-box">
    <input id="search-input" placeholder="搜索本书全文（≥2 字），Esc 关闭" autocomplete="off">
    <div class="search-meta" id="search-meta"></div>
    <div class="search-results" id="search-results"></div>
  </div>
</div>

<!-- 设置浮层 -->
<div class="overlay" id="setup-overlay" hidden>
  <div class="modal">
    <h2>连接仓库</h2>
    <label>仓库地址或本地路径
      <input id="input-path" placeholder="https://github.com/you/notes.git 或 F:\notes">
    </label>
    <label>克隆到（只在填地址时用，留空放到 ~/notes/仓库名）
      <input id="input-dest" placeholder="留空即可">
    </label>
    <label>GitHub Token（私有仓库必需，留空则沿用已保存的）
      <input id="input-token" type="password" placeholder="github_pat_…">
    </label>
    <p class="hint">Token 用 Windows DPAPI 加密后存在本机 config.json，只有本机这个账户能解开；
      建议新建一个只对该仓库有 contents 读写权限的细粒度 PAT。</p>
    <div class="modal-actions">
      <button class="link-btn" id="btn-cancel-setup">取消</button>
      <button class="btn-primary" id="btn-do-setup">连接</button>
    </div>
    <div class="modal-msg" id="setup-msg"></div>
  </div>
</div>

<!-- 同步报告 -->
<div class="overlay" id="report-overlay" hidden>
  <div class="modal">
    <h2 id="report-title">同步结果</h2>
    <div id="report-body"></div>
    <div class="modal-actions">
      <button class="btn-primary" id="btn-close-report">知道了</button>
    </div>
  </div>
</div>

<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/vendor/highlight.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
